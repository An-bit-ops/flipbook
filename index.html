
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SideTable06 — Design Manual</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ef;
      font-family: Arial, sans-serif;
      color: #242424;
    }

    header {
      text-align: center;
      padding: 16px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 500;
      margin: 0;
    }

    header p {
      font-size: 12px;
      color: #777;
      margin: 6px 0 0;
    }

    #book {
      width: 100%;
      height: 78vh;
      min-height: 480px;
      --fb-bg: transparent;
      --fb-paper: #fff;
      --fb-control-bg: rgba(30,30,30,.82);
      --fb-control-fg: #fff;
      --fb-counter-fg: #fff;
    }

    #status {
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 12px;
      color: #888;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      #book {
        height: 72vh;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>SideTable06</h1>
    <p>Design Manual</p>
  </header>

  <main>
    <div id="status">Loading design manual...</div>
    <div id="book"></div>
  </main>

  <footer>
    Drag a page corner or use the arrows to turn pages.
  </footer>

  <script src="./pdflipbook.js"></script>

  <script>
    const bookElement = document.getElementById("book");
    const statusElement = document.getElementById("status");

    bookElement.addEventListener("flipbook:ready", function () {
      statusElement.style.display = "none";
    });

    bookElement.addEventListener("flipbook:error", function (event) {
      statusElement.style.display = "block";
      statusElement.textContent =
        "Could not load the PDF. Please refresh and try again.";
      console.error("Flipbook PDF error:", event.detail);
    });

    try {
      PDFlipbook.create(bookElement, {
        url: "./SideTable06_DesignManual.pdf",
        displayMode: "auto",
        arrows: true,
        pageNumbers: true,
        controls: true,
        shadow: "always"
      });
    } catch (error) {
      statusElement.textContent =
        "Viewer failed to start. Check the browser console.";
      console.error("Flipbook initialization error:", error);
    }
  </script>
</body>
</html>
