
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ef">

  <title>SideTable06 — Design Manual</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f5f3ef;
      font-family: Arial, sans-serif;
      color: #242424;
    }

    .flipbook-header {
      padding: 16px 20px;
      text-align: center;
    }

    .flipbook-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 500;
    }

    .flipbook-header p {
      margin: 6px 0 0;
      font-size: 12px;
      color: #777;
    }

    #book {
      width: 100%;
      height: 78vh;
      min-height: 480px;
      max-height: 1000px;

      --fb-bg: transparent;
      --fb-paper: #ffffff;
      --fb-control-bg: rgba(30, 30, 30, 0.82);
      --fb-control-fg: #ffffff;
      --fb-counter-fg: #ffffff;
    }

    .loading {
      padding: 30px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }

    .flipbook-footer {
      padding: 12px;
      text-align: center;
      font-size: 11px;
      color: #888;
    }

    @media (max-width: 600px) {
      .flipbook-header {
        padding: 12px;
      }

      #book {
        height: 72vh;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>

  <header class="flipbook-header">
    <h1>SideTable06</h1>
    <p>Design Manual</p>
  </header>

  <main>
    <div id="book"
         data-pdflipbook="SideTable06_DesignMannual.pdf"
         data-display-mode="auto"
         data-arrows="true"
         data-page-numbers="true"
         data-controls="true"
         data-shadow="always"
         style="height: 78vh; min-height: 480px;">
      <div class="loading">Loading design manual...</div>
    </div>
  </main>

  <footer class="flipbook-footer">
    Drag a page corner or use the arrows to turn pages.
  </footer>

  <script src="pdflipbook.js"></script>

</body>
</html>
