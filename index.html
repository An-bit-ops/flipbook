
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SideTable06 — Design Manual</title>

  <!-- Manrope font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f3ef;
      color: #242424;
      font-family: 'Manrope', sans-serif;
    }

    header {
      text-align: center;
      padding: 20px 16px 12px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 500;
      margin: 0;
    }

    header p {
      font-size: 12px;
      color: #777;
      margin: 6px 0 0;
    }

    /* Space around the book prevents shadows being clipped */
    main {
      padding: 36px 32px 44px;
      overflow: visible;
    }

    #book {
      width: 100%;
      height: 76vh;
      min-height: 480px;
      overflow: visible;

      --fb-bg: transparent;
      --fb-paper: #fff;
      --fb-control-bg: rgba(30, 30, 30, 0.82);
      --fb-control-fg: #fff;
      --fb-counter-fg: #fff;
    }

    #status {
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    footer {
      text-align: center;
      padding: 12px 16px 20px;
      color: #888;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 14px;
      }

      main {
        padding: 24px 12px 36px;
      }

      #book {
        height: 70vh;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>SideTable06</h1>
    <p>Design Manual</p>
  </header>

  <main>
    <div id="status">Loading design manual...</div>
    <div id="book"></div>
  </main>

  <footer>
    Drag a page corner or use the arrows to turn pages.
  </footer>

  <script src="./pdflipbook.js"></script>
  <script>
    const bookElement = document.getElementById("book");
    const statusElement = document.getElementById("status");

    bookElement.addEventListener("flipbook:ready", function () {
      statusElement.style.display = "none";
    });

    bookElement.addEventListener("flipbook:error", function (event) {
      statusElement.style.display = "block";
      statusElement.textContent =
        "Could not load the PDF. Please refresh and try again.";
      console.error("Flipbook PDF error:", event.detail);
    });

    try {
      PDFlipbook.create(bookElement, {
        url: "./SideTable06_DesignManual.pdf",
        displayMode: "auto",
        arrows: true,
        pageNumbers: true,
        controls: true,
        shadow: "always"
      });
    } catch (error) {
      statusElement.textContent =
        "Viewer failed to start. Check the browser console.";
      console.error("Flipbook initialization error:", error);
    }
  </script>
</body>
</html>
