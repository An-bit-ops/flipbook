
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ef">

  <title>SideTable06 — Design Manual</title>

  <!-- Manrope font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f5f3ef;
      color: #242424;
      font-family: 'Manrope', sans-serif;
    }

    header {
      text-align: center;
      padding: 14px 16px 4px;
    }

    header h1 {
      font-size: 18px;
      line-height: 1.4;
      font-weight: 500;
      margin: 0;
    }

    header p {
      font-size: 12px;
      line-height: 1.5;
      color: #777;
      margin: 4px 0 0;
    }

    main {
      width: 100%;
      padding: 12px 32px 12px;
      overflow: visible;
    }

    #book {
      width: 100%;
      height: 76vh;
      min-height: 480px;
      overflow: visible;

      --fb-bg: transparent;
      --fb-paper: #fff;
      --fb-control-bg: rgba(30, 30, 30, 0.82);
      --fb-control-fg: #fff;
      --fb-counter-fg: #fff;
    }

    #status {
      padding: 20px;
      text-align: center;
      color: #777;
      font-size: 14px;
    }

    #page-counter {
      min-height: 30px;
      padding: 8px 0 4px;
      text-align: center;
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      color: #777;
    }

    footer {
      text-align: center;
      padding: 4px 16px 18px;
      color: #888;
      font-size: 11px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px 12px 4px;
      }

      main {
        padding: 12px 12px 8px;
      }

      #book {
        height: 70vh;
        min-height: 400px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>SideTable06</h1>
    <p>Design Manual</p>
  </header>

  <main>
    <div id="status">Loading design manual...</div>
    <div id="book"></div>
    <div id="page-counter" hidden></div>
  </main>

  <footer>
    Drag a page corner or use the arrows to turn pages.
  </footer>

  <script src="./pdflipbook.js"></script>

  <script>
    const bookElement = document.getElementById("book");
    const statusElement = document.getElementById("status");
    const pageCounter = document.getElementById("page-counter");

    let totalPages = 0;

    bookElement.addEventListener("flipbook:ready", function (event) {
      statusElement.style.display = "none";

      totalPages = event.detail.pages;
      pageCounter.hidden = false;
      pageCounter.textContent = "Page 1 of " + totalPages;
    });

    bookElement.addEventListener("flipbook:pagechange", function (event) {
      const currentPage = event.detail.page;
      totalPages = event.detail.pages;

      pageCounter.textContent =
        "Page " + currentPage + " of " + totalPages;
    });

    bookElement.addEventListener("flipbook:error", function (event) {
      statusElement.style.display = "block";
      statusElement.textContent =
        "Could not load the PDF. Please refresh and try again.";

      console.error("Flipbook PDF error:", event.detail);
    });

    try {
      PDFlipbook.create(bookElement, {
        url: "./SideTable06_DesignManual.pdf",
        displayMode: "auto",
        arrows: true,
        pageNumbers: false,
        controls: true,
        shadow: "always",
        padding: 24
      });
    } catch (error) {
      statusElement.textContent =
        "Viewer failed to start. Check the browser console.";

      console.error("Flipbook initialization error:", error);
    }
  </script>
</body>
</html>
